<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paula & José | Save The Date</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="overlay">
        <div class="envelope" id="envelope">

            <div class="flap"></div>

            <div class="envelope-front"></div>

            <div class="seal">
                P&J
            </div>

        </div>

        <p class="hint">Pulsa para abrir</p>
    </div>

    <main id="content">

        <img
            src="invitation.jpg"
            class="invitation"
            alt="Paula y José Save The Date">

        <section class="actions">

            <h2>SAVE THE DATE</h2>

            <p>25 Abril 2027</p>

            <div class="buttons">

                <a
                    class="button"
                    href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Boda+Paula+y+Jose&dates=20270425T100000Z/20270425T230000Z"
                    target="_blank">
                    Google Calendar
                </a>

                <a
                    class="button"
                    href="boda-paula-jose.ics">
                    Apple / Outlook Calendar
                </a>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
